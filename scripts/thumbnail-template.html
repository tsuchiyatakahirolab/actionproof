<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, initial-scale=1.0" />
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: rgb(243, 240, 232); }
      .canvas { position: relative; width: 1280px; height: 720px; }
      .source { display: block; width: 1280px; height: 720px; }
      .subtitle {
        position: absolute;
        top: 56px;
        left: 0;
        right: 0;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgb(83, 99, 98);
        background: rgb(243, 240, 232);
        font: 12px/1 Arial, Helvetica, sans-serif;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <img class="source" src="../submission/youtube-thumbnail.png" alt="" />
      <div class="subtitle">Human selection becomes the only permitted state delta. ExactDelta blocks release when the native WebMCP write changes anything else.</div>
    </div>
  </body>
</html>
